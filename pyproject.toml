[project]
name = "opticstream"
dynamic = ["version"]
description = "Prefect-based workflows for processing large microscopy and imaging datasets, including LSM strips and PS-OCT tiles."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Kaidong Chai" },
    { name = "Kabilar Gunalan" },
    { name = "James Jay Scherick" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "cyclopts>=3.3.0",
    "linc-convert[all] @ git+https://github.com/lincbrain/linc-convert.git@dc8f3243df01d09493a13e53305adede08784695",
    "nifti-zarr @ git+https://github.com/calvinchai/nifti-zarr-py.git@12336420beaa023cbdd9d9e5c24e3c115687fe9a",
    "psoct-toolbox @ git+https://github.com/calvinchai/psoct-toolbox.git@5182337044d2b7f8337ca205a33c9da3ddd69bda",
    "matplotlib>=3.10.8",
    "prefect[shell,slack,sqlalchemy]>=3.6.20",
    "watchdog",
    "psutil",
    "slack-sdk",
    "pydantic",
    "jinja2",
    "PyYAML",
    "dask",
    "nibabel",
    "numpy",
    "psycopg2-binary"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-git-revision-date-localized-plugin",
    "ruff"
]

[project.urls]
Homepage = "https://opticstream.lincbrain.org"
Documentation = "https://opticstream.lincbrain.org"
Source = "https://github.com/lincbrain/opticstream"
Issues = "https://github.com/lincbrain/opticstream/issues"
Changelog = "https://github.com/lincbrain/opticstream/blob/master/CHANGELOG.md"

[project.scripts]
opticstream = "opticstream.cli:main"
ops = "opticstream.cli:main"

[tool.uv.sources]
#linc-convert = { path = "/space/megaera/1/users/kchai/linc-convert", editable = true }
#nifti-zarr = { path = "/space/megaera/1/users/kchai/nifti-zarr", editable = true }
#psoct-toolbox = { path = "/space/megaera/1/users/kchai/code/psoct-toolbox", editable = true }

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opticstream*"]
exclude = ["notebooks*"]

# The version comes from the latest git tag (vX.Y.Z), which `auto` creates on release.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
markers = [
  "integration: integration tests",
]